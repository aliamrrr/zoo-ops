# Reference only: the same idea at the edge with Nginx.
# A shared-memory zone keyed by API key, 1 request per second, bursts of 60 served without delay.

limit_req_zone $http_x_api_key zone=per_key:10m rate=1r/s;
limit_req_status 429;

upstream owl_gateway {
    server 127.0.0.1:4000;  # a LiteLLM proxy, see litellm_config.yaml
    keepalive 32;
}

server {
    listen 8080;

    location /v1/ {
        if ($http_x_api_key = "") {
            return 401;
        }
        limit_req zone=per_key burst=60 nodelay;

        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 2s;
        proxy_read_timeout 60s;
        proxy_pass http://owl_gateway;
    }
}
