# Reference only: how the ideas of level 10 look in Kubernetes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zoo-ops
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: {app: zoo-ops}
  template:
    metadata:
      labels: {app: zoo-ops, track: stable}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: web
          image: ghcr.io/example/zoo-ops:1.4.2
          ports: [{containerPort: 8000}]
          env:
            - name: ZOO_JWT_SECRET_FILE
              value: /run/secrets/jwt/secret
          volumeMounts:
            - {name: jwt, mountPath: /run/secrets/jwt, readOnly: true}
          readinessProbe:
            httpGet: {path: /readyz, port: 8000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec: {command: ["sleep", "5"]}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {memory: 512Mi}
      volumes:
        - name: jwt
          secret: {secretName: zoo-jwt}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: zoo-ops
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: zoo-ops}
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
