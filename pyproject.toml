[project]
name = "zoo-ops"
version = "1.0.0"
description = "Learn ten system design patterns by fixing the backend of a tiny animal game."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["levels"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "BLE"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Starter files import what the solution will need before the TODOs use it.
"levels/*/*.py" = ["F401"]
