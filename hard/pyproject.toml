[project]
name = "zoo-platform"
version = "1.4.0"
description = "The backend of the Zoo Ops visitor app: kiosk, kitchen, guide, adoptions, pens."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "redis>=5.2",
    "PyJWT>=2.10",
]

[project.optional-dependencies]
test = ["pytest>=8.3", "httpx>=0.28", "fakeredis>=2.26"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zoo_platform = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "BLE"]

[tool.ruff.lint.isort]
known-first-party = ["zoo_platform", "zp_testkit"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]
